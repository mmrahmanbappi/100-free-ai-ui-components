<!DOCTYPE html>
<!--
  Error Message with Retry: a free AI UI component
  From 100 Free AI UI Components by MM Rahman Bappi, MIT license
  https://mmrahmanbappi.github.io/100-free-ai-ui-components/

  How to use: copy the CSS, HTML and JavaScript below into your page.
  Colors are CSS variables at the top. Change --accent to match your brand.
  Light and dark themes follow the visitor's system setting, or set
  data-theme="dark" or data-theme="light" on the html element.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Error Message with Retry | Free AI UI Component</title>
<meta name="description" content="A clear error in the chat when an answer fails, with a Retry button that shows progress and then the answer.">
<meta name="robots" content="noindex, follow">
<style>
:root{
  --accent:#5b5bd6; --accent-ink:#fff; --accent-soft:#ececfc;
  --bg:#f7f7f8; --surface:#fff; --surface-2:#f1f1f4; --ink:#17171c; --text:#3a3a44; --muted:#6c6c78;
  --line:#e3e3e8; --good:#15803d; --warn:#b45309; --bad:#c62828;
  --radius:14px; --shadow:0 1px 2px rgba(20,20,30,.06),0 8px 24px -12px rgba(20,20,30,.18);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif; --mono:ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --accent:#8b8bff; --accent-ink:#0f0f16; --accent-soft:#25254a;
  --bg:#0f0f13; --surface:#18181f; --surface-2:#212129; --ink:#f3f3f6; --text:#d4d4dc; --muted:#9a9aa8;
  --line:#2c2c36; --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6);
}}
:root[data-theme=dark]{
  --accent:#8b8bff; --accent-ink:#0f0f16; --accent-soft:#25254a;
  --bg:#0f0f13; --surface:#18181f; --surface-2:#212129; --ink:#f3f3f6; --text:#d4d4dc; --muted:#9a9aa8;
  --line:#2c2c36; --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:24px;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
/* ---- component ---- */
.wrap{width:min(100%,660px);display:flex;flex-direction:column;gap:16px}
.ai,.me{display:flex;gap:12px;align-items:flex-start}
.me{flex-direction:row-reverse}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:13px;font-weight:700}
.ai .av{background:var(--accent);color:var(--accent-ink)}.me .av{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.col{display:flex;flex-direction:column;gap:6px;min-width:0;max-width:calc(100% - 44px)}
.me .col{align-items:flex-end}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:11px 15px;color:var(--text);box-shadow:var(--shadow);min-width:0;overflow-wrap:anywhere}
.me .bubble{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);border-radius:16px 4px 16px 16px;box-shadow:none}
.meta{font-size:12px;color:var(--muted)}
.tb{display:flex;gap:2px;align-items:center}
.tb button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);height:30px;min-width:30px;padding:0 7px;border-radius:8px;cursor:pointer;font-size:13px}
.tb button:hover{background:var(--surface-2);color:var(--ink)}
.err{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--bad) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 35%,var(--line));color:var(--ink);border-radius:4px 16px 16px 16px;padding:11px 14px}
.err svg{color:var(--bad);flex:none;margin-top:1px}
.err p{margin:0 0 8px}.err small{color:var(--muted);display:block;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="me"><div class="av" aria-hidden="true">JL</div><div class="col"><div class="bubble">Summarize the attached meeting notes.</div></div></div>
  <div class="ai"><div class="av" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg></div><div class="col" id="slot" aria-live="polite"></div></div>
  <button class="btn" id="reset" type="button" style="align-self:center">Show the error again</button>
</div>
<script>
// Demo helper: add ?theme=dark or ?theme=light to the address to preview a theme.
(function(){var t=new URLSearchParams(location.search).get('theme');if(t)document.documentElement.dataset.theme=t;})();
var slot=document.getElementById('slot'),tries=0;
function error(){slot.innerHTML='<div class="err" role="alert"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 8v5M12 16.5v.5\"/></svg><div><p>Something went wrong while writing this answer.</p><small>The service is busy right now. Your message was not lost.</small><button class="btn" type="button" id="retry"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 12a9 9 0 11-3-6.7L21 8\"/><path d=\"M21 3v5h-5\"/></svg><span>Retry</span></button></div></div>';
  document.getElementById('retry').onclick=retry;}
function retry(){var b=document.getElementById('retry');b.disabled=true;b.innerHTML='<span class="spin" aria-hidden="true"></span><span>Retrying</span>';tries++;
  setTimeout(function(){slot.innerHTML='<div class="bubble">The meeting agreed on three things: launch moves to May 12, Sara owns the pricing page, and the team meets again on Friday.</div>';},1200);}
document.getElementById('reset').addEventListener('click',error);error();
</script>
</body>
</html>
