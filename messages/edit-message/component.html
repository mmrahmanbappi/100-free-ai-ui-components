<!DOCTYPE html>
<!--
  Editable User Message: a free AI UI component
  From 100 Free AI UI Components by MM Rahman Bappi, MIT license
  https://mmrahmanbappi.github.io/100-free-ai-ui-components/

  How to use: copy the CSS, HTML and JavaScript below into your page.
  Colors are CSS variables at the top. Change --accent to match your brand.
  Light and dark themes follow the visitor's system setting, or set
  data-theme="dark" or data-theme="light" on the html element.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editable User Message | Free AI UI Component</title>
<meta name="description" content="An edit button on the user message turns it into a text box with Save and Cancel, so people can fix a question and ask again.">
<meta name="robots" content="noindex, follow">
<style>
:root{
  --accent:#5b5bd6; --accent-ink:#fff; --accent-soft:#ececfc;
  --bg:#f7f7f8; --surface:#fff; --surface-2:#f1f1f4; --ink:#17171c; --text:#3a3a44; --muted:#6c6c78;
  --line:#e3e3e8; --good:#15803d; --warn:#b45309; --bad:#c62828;
  --radius:14px; --shadow:0 1px 2px rgba(20,20,30,.06),0 8px 24px -12px rgba(20,20,30,.18);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif; --mono:ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --accent:#8b8bff; --accent-ink:#0f0f16; --accent-soft:#25254a;
  --bg:#0f0f13; --surface:#18181f; --surface-2:#212129; --ink:#f3f3f6; --text:#d4d4dc; --muted:#9a9aa8;
  --line:#2c2c36; --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6);
}}
:root[data-theme=dark]{
  --accent:#8b8bff; --accent-ink:#0f0f16; --accent-soft:#25254a;
  --bg:#0f0f13; --surface:#18181f; --surface-2:#212129; --ink:#f3f3f6; --text:#d4d4dc; --muted:#9a9aa8;
  --line:#2c2c36; --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:24px;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
/* ---- component ---- */
.wrap{width:min(100%,660px);display:flex;flex-direction:column;gap:16px}
.ai,.me{display:flex;gap:12px;align-items:flex-start}
.me{flex-direction:row-reverse}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:13px;font-weight:700}
.ai .av{background:var(--accent);color:var(--accent-ink)}.me .av{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.col{display:flex;flex-direction:column;gap:6px;min-width:0;max-width:calc(100% - 44px)}
.me .col{align-items:flex-end}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:11px 15px;color:var(--text);box-shadow:var(--shadow);min-width:0;overflow-wrap:anywhere}
.me .bubble{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);border-radius:16px 4px 16px 16px;box-shadow:none}
.meta{font-size:12px;color:var(--muted)}
.tb{display:flex;gap:2px;align-items:center}
.tb button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);height:30px;min-width:30px;padding:0 7px;border-radius:8px;cursor:pointer;font-size:13px}
.tb button:hover{background:var(--surface-2);color:var(--ink)}
.me .col{width:100%}
.ed{width:min(100%,520px);background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:10px;box-shadow:var(--shadow)}
.ed textarea{width:100%;border:0;outline:0;resize:vertical;min-height:64px;background:none;color:var(--ink);line-height:1.5}
.ed .row{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:6px 14px;font-size:14px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.edited{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="me"><div class="av" aria-hidden="true">JL</div><div class="col" id="uc">
    <div class="bubble" id="ub">What is the capital of Australia? Is it Sidney?</div>
    <div class="tb"><span class="edited" id="edt" hidden>Edited</span><button type="button" id="eb"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg><span>Edit</span></button></div>
  </div></div>
  <div class="ai"><div class="av" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg></div><div class="col"><div class="bubble" id="ab" aria-live="polite">The capital of Australia is Canberra, not Sydney.</div></div></div>
</div>
<script>
// Demo helper: add ?theme=dark or ?theme=light to the address to preview a theme.
(function(){var t=new URLSearchParams(location.search).get('theme');if(t)document.documentElement.dataset.theme=t;})();
var uc=document.getElementById('uc'),ub=document.getElementById('ub'),eb=document.getElementById('eb'),ab=document.getElementById('ab'),edt=document.getElementById('edt'),box=null;
function closeEditor(){if(box){box.remove();box=null;}ub.hidden=false;eb.parentNode.hidden=false;eb.focus();}
eb.addEventListener('click',function(){if(box)return;box=document.createElement('div');box.className='ed';
  box.innerHTML='<label class="sr" for="et">Edit your message</label><textarea id="et"></textarea><div class="row"><button type="button" class="btn" id="cx">Cancel</button><button type="button" class="btn pri" id="sv">Save and ask again</button></div>';
  var ta=box.querySelector('textarea');ta.value=ub.textContent;ub.hidden=true;eb.parentNode.hidden=true;uc.insertBefore(box,ub);ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
  box.querySelector('#cx').onclick=closeEditor;
  ta.addEventListener('keydown',function(e){if(e.key==='Escape')closeEditor();});
  box.querySelector('#sv').onclick=function(){var v=ta.value.trim();if(!v)return;ub.textContent=v;edt.hidden=false;closeEditor();ab.textContent='Thinking...';
    setTimeout(function(){ab.textContent='Here is a fresh answer to your edited question: Canberra is the capital. It was chosen as a compromise between Sydney and Melbourne.';},900);};});
</script>
</body>
</html>
